[project]
name = "fridge"
version = "0"
description = "The import script's dependencies, so its tests can run"
requires-python = ">=3.12"
# The same pins as the header of scripts/fridge.py; tests/test_fridge.py
# checks they match.
dependencies = [
    "click==8.5.0",
    "httpx==0.28.1",
    "pillow==13.0.0",
    "pillow-heif==1.8.1",
    "pypdfium2==5.15.2",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
