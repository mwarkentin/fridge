name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "migrations/**"
      - wrangler.toml
      - package.json
      - package-lock.json
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # mwarkentin/infra (fridge.tf) sets these, with the token and the
    # secrets below. Until it has, there's nothing to deploy to.
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && vars.D1_DATABASE_ID != ''
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Point wrangler at the database infra made
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          [[ "$D1_DATABASE_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::D1_DATABASE_ID doesn't look like a database ID."; exit 1; }
          sed -i "s/^database_id = .*/database_id = \"$D1_DATABASE_ID\"/" wrangler.toml

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply fridge --remote

      # PARENT_EMAILS, FAMILIES, NAMES and SEES go up as Worker secrets, in a
      # file so they're never on a command line. The Access settings aren't
      # secret. FAMILIES (the families, their parents and their kids, from
      # infra's fridge_people.auto.tfvars) can be missing, which means no
      # families: every parent changes everything, and the kids stay as they
      # are. NAMES (what everyone but the kids is called beside comments,
      # from the same file) can be missing too, which means nobody has a
      # name yet. So can SEES (who sees only some families, from the same
      # file), which means everyone sees every family.
      - name: Deploy
        env:
          PARENT_EMAILS: ${{ secrets.PARENT_EMAILS }}
          FAMILIES: ${{ secrets.FAMILIES }}
          NAMES: ${{ secrets.NAMES }}
          SEES: ${{ secrets.SEES }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
        run: |
          families="${FAMILIES:-[]}"
          # The Worker turns everyone away if it can't read FAMILIES, so a
          # bad one stops here and the running Worker stays as it is. The
          # check prints nothing of the secret.
          if ! printf '%s' "$families" | jq -e '
            type == "array"
            and all(.[]; type == "object"
              and (.id | type == "string" and test("\\S") and length <= 60)
              and (.name | type == "string" and test("\\S"))
              and (.parents | type == "array" and all(type == "string"))
              and ((.kids // []) | type == "array" and all(.[]; type == "object"
                and (.name | type == "string" and test("\\S") and length <= 60)
                and (.born | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))
                and ((.artist // null) | . == null or (type == "string" and test("^[^@\\s]+@[^@\\s]+$")))
                and ((.devices // []) | type == "array" and all(type == "string" and test("^[^@\\s]+@[^@\\s]+$"))))))
            and ([.[].id | gsub("^\\s+|\\s+$"; "")] | length == (unique | length))
            and ([.[] | (.kids // [])[] | .name | gsub("^\\s+|\\s+$"; "") | ascii_downcase] | length == (unique | length))' > /dev/null 2>&1; then
            echo "::error::The FAMILIES secret isn't a list of families, each with a unique id, a name, a list of parents' emails and its kids, each with a name used once, a birthday, for a kid who adds their own art an email, and any devices as a list of emails. Fix fridge_people.auto.tfvars in mwarkentin/infra."
            exit 1
          fi
          names="${NAMES:-{\}}"
          # A bad NAMES turns comments off, so it stops here too.
          # Each person is a name, or { name, family }: what everyone sees,
          # and what their own family sees. The Worker checks the rest.
          if ! printf '%s' "$names" | jq -e '
            def ok: type == "string" and test("\\S") and length <= 30 and (contains("@") | not);
            def people: [.] | flatten;
            type == "object"
            and all(to_entries[];
              (.key | test("^[^@\\s]+@[^@\\s]+$"))
              and (.value | people | length >= 1 and length <= 6
                and all(if type == "object" then (.name | ok) and ((.family // null) == null or (.family | ok)) else ok end)))
            and ([.[] | people | .[] | if type == "object" then .name else . end | gsub("^\\s+|\\s+$"; "") | ascii_downcase] | length == (unique | length))' > /dev/null 2>&1; then
            echo "::error::The NAMES secret isn't an object of sign-in addresses to a person, or a list of up to 6 for a shared sign-in. Each person is a name, or a name and a family name, each with up to 30 characters and no @, and no two people share a name. Fix fridge_people.auto.tfvars in mwarkentin/infra."
            exit 1
          fi
          sees="${SEES:-{\}}"
          # A bad SEES turns everyone away, so it stops here too. Each address
          # sees one or more of the families above, by id. The Worker checks
          # the rest: that it's nobody's who's in a family.
          if ! jq -n -e --arg f "$families" --arg s "$sees" '
            [$f | fromjson | .[].id | gsub("^\\s+|\\s+$"; "")] as $ids
            | $s | fromjson
            | type == "object"
              and all(to_entries[];
                (.key | test("^[^@\\s]+@[^@\\s]+$"))
                and (.value | type == "array" and length >= 1
                  and all(.[]; type == "string" and (gsub("^\\s+|\\s+$"; "") as $id | any($ids[]; . == $id)))))' > /dev/null 2>&1; then
            echo "::error::The SEES secret isn't an object of sign-in addresses to lists of one or more family ids from FAMILIES. Fix fridge_people.auto.tfvars in mwarkentin/infra."
            exit 1
          fi
          jq -n --arg p "$PARENT_EMAILS" --arg f "$families" --arg n "$names" --arg s "$sees" '{PARENT_EMAILS: $p, FAMILIES: $f, NAMES: $n, SEES: $s}' > "$RUNNER_TEMP/secrets.json"
          npx wrangler deploy --var "ACCESS_TEAM_DOMAIN:$ACCESS_TEAM_DOMAIN" --var "ACCESS_AUD:$ACCESS_AUD" --secrets-file "$RUNNER_TEMP/secrets.json"
          rm "$RUNNER_TEMP/secrets.json"
