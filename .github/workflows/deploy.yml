name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "migrations/**"
      - wrangler.toml
      - package.json
      - package-lock.json
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # mwarkentin/infra (fridge.tf) sets these, with the token and the
    # secrets below. Until it has, there's nothing to deploy to.
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && vars.D1_DATABASE_ID != ''
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Point wrangler at the database infra made
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          [[ "$D1_DATABASE_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::D1_DATABASE_ID doesn't look like a database ID."; exit 1; }
          sed -i "s/^database_id = .*/database_id = \"$D1_DATABASE_ID\"/" wrangler.toml

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply fridge --remote

      # PARENT_EMAILS goes up as a Worker secret, in a file so it's never on
      # a command line. The Access settings aren't secret.
      - name: Deploy
        env:
          PARENT_EMAILS: ${{ secrets.PARENT_EMAILS }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
        run: |
          jq -n --arg p "$PARENT_EMAILS" '{PARENT_EMAILS: $p}' > "$RUNNER_TEMP/secrets.json"
          npx wrangler deploy --var "ACCESS_TEAM_DOMAIN:$ACCESS_TEAM_DOMAIN" --var "ACCESS_AUD:$ACCESS_AUD" --secrets-file "$RUNNER_TEMP/secrets.json"
          rm "$RUNNER_TEMP/secrets.json"
