<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Fridge</title>
  <meta name="description" content="The family’s art gallery.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-title" content="Fridge">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <!-- use-credentials: the browser fetches a manifest without cookies otherwise, and Access would answer with its sign-in page. -->
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <meta name="theme-color" content="#d3ebe1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#13232a" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="/fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/schoolbell.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <!-- Icons and magnets, drawn once and used everywhere with <use href="#…">. -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="g-heart" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#ff7a6b"/><stop offset=".55" stop-color="#e2382b"/><stop offset="1" stop-color="#a81e16"/></radialGradient>
      <symbol id="m-heart" viewBox="0 0 36 32"><path fill="url(#g-heart)" d="M18 30.5C8.6 23.8 2.5 18.4 2.5 10.9 2.5 6.2 6.2 2.6 10.8 2.6c3 0 5.5 1.6 7.2 4.2 1.7-2.6 4.2-4.2 7.2-4.2 4.6 0 8.3 3.6 8.3 8.3 0 7.5-6.1 12.9-15.5 19.6z"/><ellipse cx="10.6" cy="9.4" rx="4.2" ry="2.6" fill="#fff" fill-opacity=".55" transform="rotate(-28 10.6 9.4)"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.8 11.4 12 4.6l8.2 6.8M6.4 9.6v9.6h11.2V9.6M10 19.2v-5h4v5"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.8" y="5.4" width="16.4" height="14.6" rx="3"/><path d="M3.8 10h16.4M8.4 3.4v3.8M15.6 3.4v3.8M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></symbol>
      <symbol id="i-frame" viewBox="0 0 24 24"><rect x="3.4" y="4.4" width="17.2" height="15.2" rx="2.6"/><path d="M10 9v6l5-3z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.6-4.6-7.6-10.4A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.6 2.6C19.6 15.4 12 20 12 20z"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4.6 19.4l1.1-4.3 9.9-9.9a2.2 2.2 0 0 1 3.1 3.1l-9.9 9.9zM13.8 7l3.2 3.2"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v10.5M7.5 10 12 14.5 16.5 10M5 19.5h14"/></symbol>
      <symbol id="i-picture" viewBox="0 0 24 24"><rect x="3.4" y="4.6" width="17.2" height="14.8" rx="2.6"/><circle cx="9" cy="9.8" r="1.6"/><path d="M3.8 17.2l5-4.6 3.6 3.1 3-2.6 4.8 4.1"/></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4.5 9V4.5H9M19.5 9V4.5H15M4.5 15v4.5H9M19.5 15v4.5H15"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.6l4.4 4.4L19 7.4"/></symbol>
      <symbol id="i-look" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.2"/><path d="M15.2 15.2l4.8 4.8"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.6v12.8l10.2-6.4z"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></symbol>
      <symbol id="i-cake" viewBox="0 0 24 24"><path d="M5 20h14v-6.6A2.4 2.4 0 0 0 16.6 11H7.4A2.4 2.4 0 0 0 5 13.4zM5 15.6c1.2 1 2.3 1 3.5 0s2.3-1 3.5 0 2.3 1 3.5 0 2.3-1 3.5 0M12 11V8.2M12 4.4c.9.8 1.1 1.7 0 2.6-1.1-.9-.9-1.8 0-2.6z"/></symbol>
      <symbol id="i-pictures" viewBox="0 0 24 24"><rect x="7" y="3.6" width="13.4" height="13.4" rx="2.2"/><path d="M4 7.6v10.6A2.2 2.2 0 0 0 6.2 20.4h10.6M10 13.6l2.6-2.6 2 2 1.6-1.6 2.6 2.6"/></symbol>
      <symbol id="i-crayon" viewBox="0 0 24 24"><path d="M4.2 19.8l1.6-5.4 9.4-9.4 3.8 3.8-9.4 9.4zM12.8 7.4l3.8 3.8M5.8 14.4l3.8 3.8"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.8 7h14.4M9.8 7V4.8h4.4V7M7 7l.9 12.6h8.2L17 7M10.4 11v5M13.6 11v5"/></symbol>
      <symbol id="i-door" viewBox="0 0 24 24"><path d="M13.6 4.4h4.2a1.6 1.6 0 0 1 1.6 1.6v12a1.6 1.6 0 0 1-1.6 1.6h-4.2M9.6 8 5.6 12l4 4M5.8 12h9"/></symbol>
      <symbol id="i-tag" viewBox="0 0 24 24"><path d="M4 12.4V4.8A.8.8 0 0 1 4.8 4h7.6l8 8-8.4 8.4z"/><circle cx="8.6" cy="8.6" r="1.4"/></symbol>
      <symbol id="d-squiggle" viewBox="0 0 120 14"><path vector-effect="non-scaling-stroke" d="M3 9.5c7-6 12 3.6 19.6-1.2S35 3 42.4 8.6s12.8 3.4 19.8-1.6 13.4-4.4 20.6 1.2 13 3.8 19.6-1.4 10.8-4 14.6-1.2"/></symbol>
      <symbol id="d-sparkle" viewBox="0 0 24 24"><path d="M12 2.5c.7 5 2.6 7.6 8.2 8.6-5.6 1-7.5 3.6-8.2 8.6-.7-5-2.6-7.6-8.2-8.6 5.6-1 7.5-3.6 8.2-8.6z"/></symbol>
      <symbol id="d-star" viewBox="0 0 24 24"><path d="M12.2 2.8c1 2.5 1.8 4.6 2.8 6.2 2.1.2 4.3.3 6.3.7-1.6 1.6-3.3 3-4.9 4.4.6 2.2 1 4.4 1.3 6.6-2-1.2-3.8-2.4-5.6-3.4-1.9 1-3.8 2.2-5.8 3.2.5-2.2 1-4.3 1.6-6.4-1.6-1.4-3.3-2.9-4.8-4.5 2.1-.3 4.3-.5 6.4-.7.9-2 1.8-4 2.7-6.1z"/></symbol>
      <symbol id="d-heart" viewBox="0 0 24 24"><path d="M12.2 20c-1.6-1.3-7.8-5.6-8.1-10.3-.2-3.1 2-5.4 4.6-5.2 1.8.1 2.9 1.4 3.5 2.6.8-1.5 2.1-2.8 4.1-2.8 2.7 0 4.5 2.5 4.1 5.4-.7 4.7-6.6 9-8.2 10.3z"/></symbol>
      <symbol id="d-zigzag" viewBox="0 0 24 24"><path d="M2.5 15.5l3.6-6.4 3.8 6.4 3.8-6.4 3.8 6.4 3.6-5.8"/></symbol>
    </defs>
  </svg>

  <header class="bar">
    <div class="bar-inner">
      <a class="brand" href="#home" aria-label="The Fridge, home"><span class="brand-the" aria-hidden="true">the</span><span class="magnets" aria-hidden="true"><b class="mg-0" style="--n:0">F</b><b class="mg-y" style="--n:1">R</b><b class="mg-1" style="--n:2">I</b><b class="mg-2" style="--n:3">D</b><b class="mg-3" style="--n:4">G</b><b class="mg-4" style="--n:5">E</b></span></a>
      <nav class="tabs" id="tabs" aria-label="Sections"></nav>
      <div class="actions">
        <button class="btn" id="open-frame" type="button"><svg class="i" aria-hidden="true"><use href="#i-frame"/></svg><span class="lbl">Frame</span></button>
        <button class="btn primary edit-only" id="open-add" type="button"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>Add art</button>
      </div>
    </div>
  </header>

  <main id="view" class="wrap" aria-live="polite">
    <div class="loading" role="status"><span class="bounce" aria-hidden="true"><svg class="m-heart"><use href="#m-heart"/></svg><i class="m-dot"></i><i class="m-dot"></i></span><p>Opening the fridge…</p></div>
  </main>

  <div id="detail" class="overlay" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden>
    <div class="d-top">
      <button class="btn" id="d-close" type="button"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg>Close</button>
      <span class="spacer"></span>
      <span class="count" id="d-count"></span>
      <button class="btn round" id="d-prev" type="button" aria-label="Previous piece"><svg class="i" aria-hidden="true"><use href="#i-left"/></svg></button>
      <button class="btn round" id="d-next" type="button" aria-label="Next piece"><svg class="i" aria-hidden="true"><use href="#i-right"/></svg></button>
    </div>
    <div class="d-art"><img id="d-img" alt=""></div>
    <div class="d-info">
      <div id="d-read"></div>
      <form id="d-form" class="stack" hidden>
        <h2 class="form-title">Edit details</h2>
        <label class="field">Who made it <select id="f-kid"></select></label>
        <label class="field">Title <input id="f-title" maxlength="200"></label>
        <div class="two">
          <label class="field">Made on <input id="f-made" type="date" required></label>
          <label class="field">We know the <select id="f-precision"><option value="day">day</option><option value="month">month</option><option value="year">year</option></select></label>
        </div>
        <label class="field">Medium <input id="f-medium" list="mediums" maxlength="60" placeholder="Crayon"></label>
        <label class="field">What they said about it <textarea id="f-story" rows="3" maxlength="2000"></textarea></label>
        <label class="field">Tags <input id="f-tags" placeholder="cat, school, winter"></label>
        <div class="row">
          <button class="btn primary" type="submit"><svg class="i" aria-hidden="true"><use href="#i-check"/></svg>Save</button>
          <button class="btn" type="button" id="f-cancel">Cancel</button>
          <span class="spacer"></span>
          <button class="btn danger" type="button" id="f-delete"><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg>Remove</button>
        </div>
      </form>
    </div>
  </div>
  <datalist id="mediums">
    <option value="Crayon"><option value="Marker"><option value="Pencil"><option value="Coloured pencil">
    <option value="Paint"><option value="Watercolour"><option value="Chalk pastel"><option value="Collage">
  </datalist>

  <div id="frame" class="frame" role="dialog" aria-modal="true" aria-label="Slideshow of favourites" hidden>
    <div class="stage" id="stage"><img alt=""><img alt=""></div>
    <div class="fr-ctl">
      <button class="fr-btn" id="fr-full" type="button"><svg class="i" aria-hidden="true"><use href="#i-expand"/></svg>Full screen</button>
      <button class="fr-btn" id="fr-close" type="button"><svg class="i" aria-hidden="true"><use href="#i-check"/></svg>Done</button>
    </div>
    <div class="fr-cap"><div class="t" id="fr-t"></div><div class="m" id="fr-m"></div><p class="fr-hint">A new one every few seconds. Tap for the next.</p></div>
  </div>

  <!-- Add art: several pictures and PDFs at once, each looked over before it goes up. add/sheet.js runs it. -->
  <div id="add" class="sheet-wrap" hidden>
    <section class="sheet batch" id="add-sheet" role="dialog" aria-modal="true" aria-labelledby="add-title">
      <div class="sheet-head"><h2 id="add-title"><svg class="doodle" aria-hidden="true"><use href="#d-star"/></svg>Add art</h2><button class="btn round" type="button" id="add-close" aria-label="Close"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button></div>
      <input id="a-file" class="sr" type="file" multiple accept="image/*,application/pdf,.pdf" aria-label="Choose pictures and PDFs">
      <div id="a-choose" class="a-choose">
        <label class="drop" for="a-file" id="a-drop"><svg class="drop-icon" aria-hidden="true"><use href="#i-pictures"/></svg><span>Take photos, or choose pictures and PDFs</span><span class="drop-sub">As many as you like. A PDF of several pages becomes a piece per page, without the blank ones.</span><span class="drop-btn">Choose pictures</span></label>
        <p class="hint">Nothing goes up until you’ve looked over each piece. Whatever is on the fridge already, from here or the import script, is left out.</p>
      </div>
      <div id="a-review" class="a-review" hidden>
        <fieldset class="who" id="a-who"><legend>Who made these?</legend></fieldset>
        <p class="a-summary" id="a-summary" tabindex="-1"></p>
        <ol class="a-list" id="a-list" aria-label="The pieces"></ol>
      </div>
      <div id="a-foot" class="a-foot" hidden>
        <div class="a-progress" id="a-progress" hidden><progress id="a-bar" max="1" value="0"></progress><span id="a-status" role="status"></span></div>
        <div class="a-said" id="a-said" role="status" hidden></div>
        <div class="a-buttons">
          <button class="btn primary" id="a-submit" type="button">Add to the fridge</button>
          <button class="btn" id="a-more" type="button"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>Add more</button>
          <button class="btn" id="a-restart" type="button">Start over</button>
        </div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
