# A public preview of the page with a made-up family (preview/worker.js).
# It has no database, bucket or sign-in on purpose, so there's nothing
# private it could reach: never add bindings here. The Preview workflow
# deploys one per pull request as fridge-preview-pr-<number>, using this
# file from main, and deletes it when the pull request closes.
name = "fridge-preview"
main = "worker.js"
compatibility_date = "2026-10-01"
# Uploaded as it is: no build step reads anything but this one file.
no_bundle = true

# Public on workers.dev, unlike the fridge Worker: everything here is made up.
workers_dev = true
preview_urls = false

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = true
